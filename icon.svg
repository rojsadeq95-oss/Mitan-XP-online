<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="512" height="512">
  <defs>
    <!-- باکگراوندا شینا تۆخ -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1B2B"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>

    <!-- ڕەنگێ شین بۆ پڕیا سەرەکی یا M -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CD5FF"/>
      <stop offset="50%" stop-color="#1A8CFF"/>
      <stop offset="100%" stop-color="#0052B3"/>
    </linearGradient>

    <!-- ڕەنگێ زێڕی بۆ بنێ M و جەمکێ -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>

    <!-- کاریگەرییا درەوشانەڤەیێ (Neon Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- چوارچۆڤێ باکگراوندێ -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="90"/>

  <!-- هێڵا چوارچۆڤێ دەرەکی (شین و زێڕی) -->
  <rect x="25" y="25" width="450" height="450" rx="80" fill="none" stroke="#1A8CFF" stroke-width="4" opacity="0.6" filter="url(#glow)"/>
  <rect x="25" y="25" width="450" height="450" rx="80" fill="none" stroke="#FFB300" stroke-width="2" opacity="0.4" stroke-dasharray="150 300"/>

  <!-- جەمکا زێڕی ل سەرێ M -->
  <circle cx="250" cy="120" r="38" fill="url(#goldGlow)" filter="url(#glow)"/>

  <!-- شێوەیێ M (تێکەڵا شین و زێڕی) -->
  <g filter="url(#glow)">
    <!-- بەشێ زێڕی یێ ژێرێ لایێن M -->
    <path d="M120 220 L120 380 Q120 400 140 390 L180 340 L180 260 Z" fill="url(#goldGlow)" />
    <path d="M380 220 L380 380 Q380 400 360 390 L320 340 L320 260 Z" fill="url(#goldGlow)" />

    <!-- لایێ چەپێ یێ سەرەکی M -->
    <path d="M110 200 Q100 200 115 220 L250 340 L180 260 L130 205 Z" fill="url(#blueGlow)" />
    
    <!-- لایێ ڕاستێ یێ سەرەکی M -->
    <path d="M390 200 Q400 200 385 220 L250 340 L320 260 L370 205 Z" fill="url(#blueGlow)" />

    <!-- تاجێ شین یێ سەرەوە yێ M -->
    <path d="M110 200 L250 310 L390 200 L370 180 L250 270 L130 180 Z" fill="url(#blueGlow)" />
  </g>
</svg>
