<!-- Metallic Gold Gradient -->
<linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FFF176"/>
  <stop offset="35%" stop-color="#FFD54F"/>
  <stop offset="70%" stop-color="#FFB300"/>
  <stop offset="100%" stop-color="#FF6F00"/>
</linearGradient>

<!-- Glowing Electric Blue Gradient -->
<linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00E5FF"/>
  <stop offset="100%" stop-color="#0288D1"/>
</linearGradient>

<!-- Neon Cyan & Gold Glow Filter -->
<filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="10" result="blur1"/>
  <feGaussianBlur stdDeviation="20" result="blur2"/>
  <feMerge>
    <feMergeNode in="blur2"/>
    <feMergeNode in="blur1"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
  <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
</filter>
<circle cx="410" cy="160" r="5" fill="#00E5FF" filter="url(#neonGlow)"/>
<circle cx="430" cy="230" r="7" fill="#FFD54F"/>
<circle cx="390" cy="310" r="4" fill="#FFB300"/>
<circle cx="425" cy="360" r="6" fill="#00E5FF"/>
<!-- Letter P (Glowing Metallic Gold) -->
<path d="M 285 190 L 345 190 C 375 190 390 205 390 228 C 390 252 375 265 345 265 L 318 265 L 318 310 L 285 310 Z M 318 215 L 318 240 L 340 240 C 352 240 358 235 358 227 C 358 219 352 215 340 215 Z" 
      fill="url(#goldMetallic)" stroke="#FFE082" stroke-width="1.5"/>

<!-- Lightning Bolt Arrow Charging Upward (Center Emblem) -->
<path d="M 210 335 L 260 235 L 230 235 L 305 145 L 285 220 L 320 220 Z" 
      fill="url(#goldMetallic)" 
      stroke="#FFFFFF" 
      stroke-width="2" 
      filter="url(#neonGlow)"/>
