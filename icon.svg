<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="6" />

  <!-- Graduation Cap -->
  <g transform="translate(256, 175) scale(1.1)">
    <polygon points="0,-45 100,0 0,45 -100,0" fill="#00f2fe" />
    <polygon points="0,-45 100,0 0,45 -100,0" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M-60,25 L-60,70 C-60,90 60,90 60,70 L60,25" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M70,10 L105,35 L105,72" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="105" cy="78" r="6" fill="#f59e0b" />
  </g>

  <!-- App Name MitanXP -->
  <text x="256" y="350" font-family="Segoe UI, Tahoma, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">Mitan<tspan fill="#ffc107">XP</tspan></text>
  
  <!-- Subtitle -->
  <text x="256" y="400" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="3">IT PLATFORM</text>
</svg>
